name: Aditunis CI

on:
  push:
    branches:
      - feature/aditunis-accessible-telephony
    paths:
      - 'aditunis/**'
      - '.github/workflows/aditunis-ci.yml'
  pull_request:
    paths:
      - 'aditunis/**'
      - '.github/workflows/aditunis-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aditunis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
